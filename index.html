<script>
const COL='berita_acara',CF='config/school',BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let db,as,cfg={},docs={},cur=null,view='ba',tab='I',admin=false,canW=true,pend={},tm,kopData=null,arm=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOCCSS=`.paper{position:relative;width:794px;height:1123px;padding:76px 95px;box-sizing:border-box;overflow:hidden;font:12pt/1.55 "Times New Roman",serif;color:#000;background:#fff}.paper .in{height:calc(100% - 52px);overflow:hidden}.paper .ft{position:absolute;left:95px;right:95px;bottom:76px}.paper h4{text-align:center;margin:10px 0;font-size:1.08em}.paper .kop{text-align:center}.paper .kop img{width:100%}.paper .ln{display:inline-block;border-bottom:1px solid #000;min-width:50px;padding:0 6px;text-align:center}.paper table{border-collapse:collapse;width:100%}.paper td{vertical-align:top;padding:1px 4px}.paper .bx{border:1px solid #000;padding:6px 8px;min-height:60px}.paper .c{text-align:center}.paper img.t{height:56px}@page{size:A4;margin:15mm}`;
document.head.insertAdjacentHTML('beforeend','<style>'+DOCCSS+'</style>');
function dt(s){const d=new Date(s+'T00:00:00');return isNaN(d)?{}:{h:d.toLocaleDateString('id-ID',{weekday:'long'}),t:d.getDate(),b:BL[d.getMonth()],y:d.getFullYear()}}
const S=(v,w)=>`<span class="ln" ${w?`style="min-width:${w}px"`:''}>${esc(v)||'&nbsp;'}</span>`;
function makeDoc(d,kop){
 const t=dt(d.tanggal),ab=d.absen||[],P=Number(d.peserta)||0,H=Math.max(0,P-ab.length),n=d.sekolah||cfg.nama||'',J=cfg.jenis||'Asesmen Sumatif';
 const R=(a,b)=>`<tr><td style="width:36%">${a}</td><td style="width:12px">:</td><td>${b}</td></tr>`;
 const sg=i=>`<tr><td style="width:140px">Pengawas ke-${i}</td><td>: ${S(d['p'+i+'n'],170)}</td><td rowspan="2" class="c" style="width:170px"><b>TTD</b><br>${d['s'+i]?`<img class="t" src="${d['s'+i]}">`:'<br><br>'}</td></tr><tr><td>NIP</td><td>: ${S(d['p'+i+'p'],170)}</td></tr>`;
 return `<div class="in"><div class="kop">${kop?`<img src="${kop}">`:'KOP SEKOLAH'}</div><h4>BERITA ACARA<br>${esc(J.toUpperCase())}<br>TAHUN AJARAN ${esc(cfg.tahun||'')}</h4>
 <p style="text-align:justify">Pada hari ini ${S(t.h,90)} tanggal ${S(t.t,40)} bulan ${S(t.b,90)} tahun ${S(t.y,50)}, di ${S(n,200)} telah diselenggarakan ${esc(J)}, dari pukul ${S(d.mulai,50)} sampai dengan pukul ${S(d.selesai,50)}.</p>
 <table>${R('1. Mata Pelajaran','1. '+S(d.m1,220))}${R('','2. '+S(d.m2,220))}${R('','3. '+S(d.m3,220))}${R('','4. '+S(d.m4,220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Ruang',S(d.ruang,220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Sesi',S(d.sesi,220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Jumlah Peserta Seharusnya',S(P||'',220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Jumlah Hadir (Ikut Ujian)',S(P?H:'',220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Jumlah Tidak Hadir',S(P?ab.length:'',220))}${R('&nbsp;&nbsp;&nbsp;&nbsp;Peserta Tidak Hadir',ab.length?ab.map((x,i)=>`${i+1}. ${esc(x)}`).join('<br>'):S('',220))}</table>
 <p style="margin:10px 0 2px">2. Catatan selama pelaksanaan ujian :</p><div class="bx">${esc(d.catatan).replace(/\n/g,'<br>')}</div>
 <p style="margin:12px 0 2px">Yang membuat berita acara :</p><table>${sg(1)}${sg(2)}</table>
 <div class="bx c" style="margin-top:12px;min-height:0"><b>Catatan:</b><br>Diisi dan dicetak setelah semua peserta selesai mengerjakan ujian</div></div><div class="bx c ft" style="min-height:0">${esc(n.toUpperCase())||'NAMA SEKOLAH'}</div>`}
function setLive(on,m){const e=$('#live');e.className='live'+(on?' on':'');e.textContent=on?'Realtime':(m||'Offline')}
function loadKop(){kopData=cfg.kopImg||null}

function render(){
 $('#nav').innerHTML=[['ba','Berita Acara'],['gd','Panduan'],...(admin?[['st','Pengaturan']]:[])].map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('');
 const a=$('#app');
 if(view==='gd')a.innerHTML=GUIDE;
 else if(view==='st')a.innerHTML=`<div class="card"><h3>Pengaturan Sekolah (Admin)</h3>${['nama|Nama Sekolah (mis. SMA Negeri 1 …)','tahun|Tahun Ajaran','jenis|Jenis Asesmen'].map(x=>{const[k,l]=x.split('|');return `<label>${l}<input data-c="${k}" value="${esc(cfg[k]||'')}"></label>`}).join('')}
 <label>KOP Sekolah (gambar)<input type="file" id="kopf" accept="image/*"></label><p class="mut">Unggah gambar kop (PNG/JPG, lebar penuh). Nama sekolah akan menjadi isian awal setiap berita acara baru.</p>${cfg.kop?`<img src="${kopSrc()}" style="width:100%;background:#fff;border-radius:8px">`:''}</div>`;
 else if(!cur)a.innerHTML=`<button class="p" id="add" style="width:100%">＋ Berita Acara Baru</button>`+(Object.keys(docs).sort((x,y)=>(docs[y].tanggal||'').localeCompare(docs[x].tanggal||'')||(docs[y].dibuat||0)-(docs[x].dibuat||0)).map(id=>{const d=docs[id];return `<div class="item" data-id="${id}"><b>${esc(d.m1||'(Mapel belum diisi)')}<span class="bd ${d.status}">${d.status==='final'?'Final':'Draft'}</span></b><div class="mut">${esc(d.tanggal||'')} · Ruang ${esc(d.ruang||'-')} · Sesi ${esc(d.sesi||'-')}</div></div>`}).join('')||'<p class="mut" style="text-align:center">Belum ada berita acara.</p>');
 else{a.innerHTML=`<div class="bar" style="margin-bottom:10px"><button id="back">← Daftar</button><button id="tI">Isi</button><button id="tP">Pratinjau</button><span id="st" class="mut" style="flex:1;text-align:right"></span></div>
 <div id="pI"><div class="card"><h3>Pelaksanaan</h3>${I('sekolah','Nama Sekolah')}${I('tanggal','Tanggal','date')}<div class="row">${I('mulai','Pukul mulai','time')}${I('selesai','Sampai pukul','time')}</div></div>
 <div class="card"><h3>Data Ujian</h3>${I('m1','Mata Pelajaran 1')}${I('m2','Mata Pelajaran 2')}${I('m3','Mata Pelajaran 3')}${I('m4','Mata Pelajaran 4')}<div class="row">${I('ruang','Ruang')}${I('sesi','Sesi')}</div>${I('peserta','Jumlah Peserta Seharusnya','number','inputmode="numeric" min="0"')}</div>
 <div class="card"><h3>Peserta Tidak Hadir</h3><div class="stats"><div><b id="sP">0</b>Seharusnya</div><div><b id="sH">0</b>Hadir</div><div><b id="sA">0</b>Tidak hadir</div></div><div class="row"><label>Nama / No. Peserta<input id="aN"></label><button id="aB" class="p">Tambah</button></div><div id="aL"></div></div>
 <div class="card"><h3>Catatan selama pelaksanaan ujian</h3><textarea data-f="catatan" rows="4"></textarea></div>
 ${[1,2].map(i=>`<div class="card"><h3>Pengawas ke-${i}</h3>${I('p'+i+'n','Nama')}${I('p'+i+'p','NIP','text','inputmode="numeric"')}<div id="sg${i}"></div><button data-sig="${i}" style="margin-top:8px;width:100%">✍ Tanda tangan di layar</button></div>`).join('')}</div>
 <div id="pP" class="card" style="display:none;padding:6px"></div>
 <div class="row" style="margin-top:6px"><button id="bFin"></button><button id="bDl" class="p">⬇ Unduh PDF</button><button id="bDel" class="d"></button></div>`;syncDoc()}}
function syncDoc(){
 const d=docs[cur];if(!d||!$('#pI'))return;const lk=d.status==='final'||!canW;
 document.querySelectorAll('#pI [data-f]').forEach(e=>{const k=e.dataset.f;if(e!==document.activeElement&&!(k in pend))e.value=d[k]??'';e.disabled=lk});
 ['aN','aB'].forEach(i=>$('#'+i).disabled=lk);document.querySelectorAll('[data-sig]').forEach(b=>b.disabled=lk);
 const ab=d.absen||[],P=Number(d.peserta)||0;$('#sP').textContent=P;$('#sA').textContent=ab.length;$('#sH').textContent=Math.max(0,P-ab.length);
 $('#aL').innerHTML=ab.map((x,i)=>`<div class="li"><span>${i+1}. ${esc(x)}</span><button class="d" data-ra="${i}" ${lk?'disabled':''}>✕</button></div>`).join('');
 [1,2].forEach(i=>$('#sg'+i).innerHTML=d['s'+i]?`<img class="sg" src="${d['s'+i]}">`:'<div class="mut">Belum ada tanda tangan.</div>');
 $('#st').textContent=(d.status==='final'?'🔒 Final':'Draft')+(d.diperbarui?' · '+new Date(d.diperbarui).toLocaleTimeString('id-ID'):'');
 const f=$('#bFin');f.textContent=d.status==='final'?'🔓 Buka Kunci':'✔ Finalkan';f.className=d.status==='final'?'':'g';f.disabled=!canW||(d.status==='final'&&!admin);
 const x=$('#bDel');x.textContent='Hapus';x.style.display=admin?'':'none';
 $('#pI').style.display=tab==='I'?'':'none';$('#pP').style.display=tab==='P'?'':'none';$('#tI').className=tab==='I'?'on':'';$('#tP').className=tab==='P'?'on':'';
 if(tab==='P')showPrev(d)}
function fit(p){const n=p.querySelector('.in');let s=12;while(n.scrollHeight>n.clientHeight+1&&s>7){s-=.5;p.style.fontSize=s+'pt'}}
function showPrev(d){const h=$('#pP'),sc=Math.min(1,(h.clientWidth-12)/794);h.innerHTML=`<div style="height:${1123*sc}px;overflow:hidden"><div style="transform:scale(${sc});transform-origin:0 0;width:794px"><div class="paper">${makeDoc(d,kopSrc())}</div></div></div>`;const p=h.querySelector('.paper');fit(p);p.querySelectorAll('img').forEach(i=>i.onload=()=>fit(p))}
async function makePdf(d){const w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0';w.innerHTML=`<div class="paper">${makeDoc(d,kopData||kopSrc())}</div>`;document.body.append(w);const p=w.firstChild;try{await Promise.all([...p.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)));fit(p);const c=await html2canvas(p,{scale:2,backgroundColor:'#fff'}),pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);return pdf.output('blob')}finally{w.remove()}}
function save(p){return db.doc(COL+'/'+cur).update({...p,diperbarui:Date.now()}).catch(e=>setLive(false,'Gagal simpan'))}
function setCfg(p){return db.doc(CF).set({...cfg,...p}).catch(e=>alert('Hanya admin (Editor) yang dapat mengubah pengaturan.'))}
function pad(i){
 const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="pd"><b>Tanda tangan Pengawas ke-'+i+'</b><canvas width="600" height="240"></canvas><div class="row"><button id="pc">Hapus</button><button id="px">Batal</button><button class="p" id="ps">Simpan</button></div></div>';
 document.body.append(o);const c=o.querySelector('canvas'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,240);x.lineWidth=4;x.lineCap=x.lineJoin='round';x.strokeStyle='#000';let dr=0,dirty=0;
 const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*240/r.height]};
 c.onpointerdown=e=>{dr=dirty=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...P(e));x.lineTo(...P(e));x.stroke()};c.onpointermove=e=>{if(dr){x.lineTo(...P(e));x.stroke()}};c.onpointerup=()=>dr=0;
 o.querySelector('#pc').onclick=()=>{x.fillStyle='#fff';x.fillRect(0,0,600,240);dirty=0};o.querySelector('#px').onclick=()=>o.remove();
 o.querySelector('#ps').onclick=()=>{if(dirty)save({['s'+i]:c.toDataURL('image/png')});o.remove()}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,.item');if(!t)return;
 if(t.dataset.v){view=t.dataset.v;cur=view==='ba'?cur:cur;render();return}
 if(!db)return;
 if(t.id==='add'){const r=db.collection(COL).doc();await r.set({status:'draft',sekolah:cfg.nama||'',tanggal:new Date().toISOString().slice(0,10),peserta:0,absen:[],dibuat:Date.now(),diperbarui:Date.now()});cur=r.id;tab='I';render();return}
 if(t.classList.contains('item')){cur=t.dataset.id;tab='I';render();return}
 if(t.id==='back'){cur=null;render();return}
 if(t.id==='tI'||t.id==='tP'){tab=t.id[1];syncDoc();return}
 const d=docs[cur];if(!d)return;
 if(t.dataset.sig)pad(t.dataset.sig);
 else if(t.id==='aB'){const v=$('#aN').value.trim();if(v){$('#aN').value='';save({absen:[...(d.absen||[]),v]})}}
 else if(t.dataset.ra!==undefined)save({absen:d.absen.filter((_,i)=>i!=t.dataset.ra)});
 else if(t.id==='bFin')save({status:d.status==='final'?'draft':'final'});
 else if(t.id==='bDel'){if(!arm){arm=1;t.textContent='Klik lagi untuk hapus';setTimeout(()=>{arm=0;if(t.isConnected)t.textContent='Hapus'},3000)}else{const id=cur;cur=null;arm=0;await db.doc(COL+'/'+id).delete();render()}}
 else if(t.id==='bDl'){
  t.disabled=true;t.textContent='Membuat PDF…';let h;try{h=await makePdf(d)}catch(x){alert('Gagal membuat PDF.')}t.disabled=false;t.textContent='⬇ Unduh PDF';if(!h)return;
  const dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.append(a);a.click();a.remove()}};
  if(dl){try{await dl.save({filename:'Berita-Acara-'+(d.m1||'Asesmen').replace(/\W+/g,'-')+'-'+(d.tanggal||'')+'.pdf',data:h})}catch(x){}}
  else{tab='P';syncDoc();window.print()}}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k||!db)return;pend[k]=e.target.type==='number'?Number(e.target.value):e.target.value;clearTimeout(tm);tm=setTimeout(()=>{const p=pend;pend={};save(p)},500)});
document.addEventListener('change',async e=>{

const GUIDE=`<div class="card"><h3>👤 Panduan Admin</h3><ol><li><b>Bagikan alamat web ini</b> ke semua pengawas. Mereka masuk dengan akun Google. Admin ditentukan oleh daftar email admin di <code>index.html</code> dan aturan Firestore.</li><li>Buka tab <b>Pengaturan</b>: isi nama sekolah, tahun ajaran, jenis asesmen, lalu <b>unggah gambar KOP</b>.</li><li>Buat berita acara per ruang/sesi lewat <b>＋ Berita Acara Baru</b> (atau minta pengawas membuatnya sendiri).</li><li>Pantau daftar: label <i>Draft</i> berarti belum selesai, <i>Final</i> berarti sudah dikunci.</li><li>Setelah final, buka berita acara → <b>Unduh PDF</b> (A4, siap cetak).</li><li>Hanya admin yang dapat <b>Buka Kunci</b> berita acara final dan <b>Hapus</b>.</li></ol></div>
<div class="card"><h3>📝 Panduan Pengawas</h3><ol><li>Buka tautan dari admin dan masuk dengan akun yang diundang. Indikator <b>● Realtime</b> di kanan atas harus menyala.</li><li>Pilih berita acara ruang Anda (atau buat baru), lalu isi tab <b>Isi</b>: tanggal, jam, mata pelajaran, ruang, sesi, jumlah peserta.</li><li>Tambahkan <b>peserta tidak hadir</b> satu per satu; jumlah hadir terhitung otomatis.</li><li>Tulis <b>catatan</b> kejadian selama ujian bila ada.</li><li>Isi nama dan NIP, lalu tekan <b>✍ Tanda tangan di layar</b> dan tanda tangani dengan jari. Tekan <i>Simpan</i>.</li><li>Cek tab <b>Pratinjau</b>, lalu tekan <b>✔ Finalkan</b> setelah semua peserta selesai ujian.</li></ol><p class="mut">Isian tersimpan otomatis dan terlihat langsung oleh pengawas lain. Hindari mengetik di kolom yang sama secara bersamaan.</p></div>`;
